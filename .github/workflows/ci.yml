name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 语法检查
        run: |
          for f in $(find server public/js -name '*.js'); do node --check "$f"; done
      - name: 单元与接口测试
        run: npm test
      - name: 启动冒烟
        run: |
          DB_PATH=/tmp/smoke.db SESSION_SECRET=0123456789abcdef0123456789abcdef ENABLE_CRON=0 PORT=3999 node server/index.js &
          sleep 3
          curl -fsS http://127.0.0.1:3999/api/health | tee /dev/stderr | grep -q '"status":"ok"'
